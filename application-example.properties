# ============================================================
# Online Banking Management System — Example Configuration
# ============================================================
# Copy this file to application.properties and update values.
# DO NOT commit real credentials to version control.
# ============================================================

# Server
server.port=8085

# PostgreSQL Database
# Create database first:  CREATE DATABASE online_banking;
spring.datasource.url=jdbc:postgresql://localhost:5432/online_banking
spring.datasource.username=your_postgres_username
spring.datasource.password=your_postgres_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Alternatively, use environment variables:
# spring.datasource.url=${DB_URL}
# spring.datasource.username=${DB_USERNAME}
# spring.datasource.password=${DB_PASSWORD}

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# Session Timeout (30 minutes)
server.servlet.session.timeout=30m

# Logging
logging.level.com.onlinebanking=INFO
